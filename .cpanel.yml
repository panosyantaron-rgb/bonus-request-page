---
deployment:
  tasks:
    # $HOME is the cPanel account's home directory — no username to fill in.
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH/api

    # Frontend
    - /bin/cp index.html      $DEPLOYPATH/
    - /bin/cp adminka.html    $DEPLOYPATH/
    - /bin/cp style.css       $DEPLOYPATH/
    - /bin/cp script.js       $DEPLOYPATH/
    - /bin/cp bg.png          $DEPLOYPATH/
    - /bin/cp .htaccess       $DEPLOYPATH/

    # Backend API — copied as a group so a new endpoint can never be
    # left behind. api/config.php is gitignored, so it is not in the repo
    # and the server's real credentials are never overwritten.
    - /bin/cp -r api/*.php $DEPLOYPATH/api/
