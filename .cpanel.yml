---
deployment:
  tasks:
    # $HOME is the cPanel account's home directory — no username to fill in.
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH/api

    # Frontend
    - /bin/cp index.html      $DEPLOYPATH/
    - /bin/cp adminka.html    $DEPLOYPATH/
    - /bin/cp style.css       $DEPLOYPATH/
    - /bin/cp script.js       $DEPLOYPATH/
    - /bin/cp bg.png          $DEPLOYPATH/
    - /bin/cp .htaccess       $DEPLOYPATH/

    # Backend API (config.php is NOT copied — it stays on the server with your real credentials)
    - /bin/cp api/db.php              $DEPLOYPATH/api/
    - /bin/cp api/auth.php            $DEPLOYPATH/api/
    - /bin/cp api/login.php           $DEPLOYPATH/api/
    - /bin/cp api/claims.php          $DEPLOYPATH/api/
    - /bin/cp api/bonuses.php         $DEPLOYPATH/api/
    - /bin/cp api/config.example.php  $DEPLOYPATH/api/
